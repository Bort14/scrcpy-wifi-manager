name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish src/ScrcpyWifiManager/ScrcpyWifiManager.csproj -c Release -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyWifiManager-windows-x64
          path: dist/ScrcpyWifiManager.exe
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist/ScrcpyWifiManager.exe --title "Scrcpy WiFi Manager $env:GITHUB_REF_NAME" --generate-notes
