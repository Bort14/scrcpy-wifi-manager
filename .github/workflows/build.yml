name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish src/ScrcpyWifiManager/ScrcpyWifiManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath scrcpy-wifi-manager-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-wifi-manager-win-x64
          path: scrcpy-wifi-manager-win-x64.zip
      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" scrcpy-wifi-manager-win-x64.zip --clobber
