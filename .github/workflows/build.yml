name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish src/ScrcpyWifiManager/ScrcpyWifiManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath scrcpy-wifi-manager-win-x64.zip
          $hash = (Get-FileHash scrcpy-wifi-manager-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  scrcpy-wifi-manager-win-x64.zip" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-wifi-manager-win-x64
          path: |
            scrcpy-wifi-manager-win-x64.zip
            SHA256SUMS.txt
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" scrcpy-wifi-manager-win-x64.zip SHA256SUMS.txt --title "Scrcpy WiFi Manager $env:GITHUB_REF_NAME" --generate-notes
